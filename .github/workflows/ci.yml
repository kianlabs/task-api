name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taskapi
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: taskdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: "8081"
      DATABASE_URL: "postgres://taskapi:devpassword@127.0.0.1:5432/taskdb?sslmode=disable"
      TEST_DATABASE_URL: "postgres://taskapi:devpassword@127.0.0.1:5432/taskdb_test?sslmode=disable"
      JWT_SECRET: "ci-secret-jwt-key-must-be-at-least-32-chars-long"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require formatting with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Build binary
        run: go build -v ./...

      - name: Apply migrations to test database
        env:
          PGPASSWORD: devpassword
        run: |
          psql -h 127.0.0.1 -U taskapi -d postgres -c "CREATE DATABASE taskdb_test;" || true
          for file in $(ls -1 migrations/*.sql | sort); do
            echo "Applying migration: $file"
            psql -h 127.0.0.1 -U taskapi -d taskdb_test -f "$file"
          done

      - name: Run tests with race detector
        run: go test -v -race ./...

  docker:
    name: Docker Build
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: task-api:latest
