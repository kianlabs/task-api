openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: |
    REST API manajemen task dan project dengan autentikasi JWT.
    Dibangun dengan Go standard library (`net/http`) dan PostgreSQL.
servers:
  - url: http://localhost:8081
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Tasks
  - name: Projects
  - name: Members
  - name: Dashboard

paths:
  /health:
    get:
      tags: [Health]
      summary: Cek status server
      security: []
      responses:
        '200':
          description: Server hidup
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /register:
    post:
      tags: [Auth]
      summary: Registrasi user baru
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6, maxLength: 72 }
      responses:
        '201':
          description: User dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me:
    get:
      tags: [Profile]
      summary: Profil user saat ini
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Ubah email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Profil terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/password:
    patch:
      tags: [Profile]
      summary: Ganti password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 6, maxLength: 72 }
      responses:
        '204': { description: Password diganti }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Ringkasan statistik task
      responses:
        '200':
          description: Statistik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }

  /tasks:
    get:
      tags: [Tasks]
      summary: Daftar task yang dapat diakses
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/TaskPriority' }
        - name: project_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: q
          in: query
          description: Pencarian pada title dan description
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, deadline, priority, created_at]
            default: id
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Daftar task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskList'
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Tasks]
      summary: Buat task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Task dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskID'
    get:
      tags: [Tasks]
      summary: Detail task
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tasks]
      summary: Update task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: Task terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Hapus task
      responses:
        '204': { description: Task dihapus }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects:
    get:
      tags: [Projects]
      summary: Daftar project yang diikuti user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
    post:
      tags: [Projects]
      summary: Buat project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Project dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Projects]
      summary: Detail project
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Projects]
      summary: Update project (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: Project terbaru
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Projects]
      summary: Hapus project (owner)
      responses:
        '204': { description: Project dihapus beserta task dan member }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Members]
      summary: Daftar member project
      responses:
        '200':
          description: Daftar member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Members]
      summary: Tambah member (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, minimum: 1 }
                role:
                  type: string
                  enum: [admin, member]
                  default: member
      responses:
        '201':
          description: Member ditambahkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Members]
      summary: Keluarkan member (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, minimum: 1 }
      responses:
        '204': { description: Member dikeluarkan }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{id}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: userID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [Members]
      summary: Ubah role member (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, member]
      responses:
        '200':
          description: Role terbaru
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [Tasks]
      summary: Daftar task dalam project
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/TaskPriority' }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Daftar task project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tasks]
      summary: Buat task dalam project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Task dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    TaskID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ProjectID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Input tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Tidak punya izin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Konflik data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit terlampaui
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: 'unauthorized' }

    TaskStatus:
      type: string
      enum: [todo, in_progress, done]

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64, nullable: true }
        assignee_id: { type: integer, format: int64, nullable: true }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        deadline: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskInput:
      type: object
      required: [title, status, priority, deadline]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        deadline: { type: string, format: date }
        project_id: { type: integer, format: int64, nullable: true }
        assignee_id: { type: integer, format: int64, nullable: true }

    TaskList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Project:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        owner_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }

    ProjectList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Member:
      type: object
      properties:
        project_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        email: { type: string, format: email }
        role:
          type: string
          enum: [owner, admin, member]
        created_at: { type: string, format: date-time }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    DashboardStats:
      type: object
      properties:
        total_tasks: { type: integer }
        by_status:
          type: object
          properties:
            todo: { type: integer }
            in_progress: { type: integer }
            done: { type: integer }
        by_priority:
          type: object
          properties:
            low: { type: integer }
            medium: { type: integer }
            high: { type: integer }
            urgent: { type: integer }
        overdue: { type: integer }
        due_today: { type: integer }
        projects: { type: integer }

security:
  - bearerAuth: []
